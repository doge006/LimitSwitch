name: Release

# Builds LimitSwitch-Setup.exe, tests it (installs silently, the app starts and its full view
# opens, installing again over the running copy works, the uninstaller removes it), builds the
# macOS DMGs and tests the Apple silicon one through scripts/install-mac.sh (the README's install
# command), then publishes all three as release v<version> (account_switcher/version.py).
# The Windows steps wait with WaitForExit on the installer itself: Start-Process -Wait would also wait for the app it starts.
on:
  workflow_dispatch:  # manual only
    inputs:
      publish:
        description: "Publish the release (off: build and test only)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build the installer
        run: ./scripts/build_windows.ps1
      - name: Install silently and run it (demo accounts)
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'Installed LimitSwitch'
          (Start-Process -PassThru -FilePath build\LimitSwitch-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$dir`"", '/TASKS=startmenu').WaitForExit()
          if (-not (Test-Path "$dir\LimitSwitch.exe")) { throw 'the exe was not installed' }
          if (-not (Test-Path "$dir\unins000.exe")) { throw 'no uninstaller' }
          # A silent install starts the app in the tray; close it and start it in demo mode instead.
          $url = "$dir\.runtime\tray.url"
          foreach ($i in 1..80) { if (Test-Path $url) { break }; Start-Sleep -Milliseconds 250 }
          & "$dir\runtime\python.exe" "$dir\LimitSwitch.pyw" --quit
          Start-Process -FilePath "$dir\LimitSwitch.exe" -ArgumentList '--demo', '--show'
          foreach ($i in 1..80) { if (Test-Path $url) { break }; Start-Sleep -Milliseconds 250 }
          if (-not (Test-Path $url)) { throw 'the app did not start' }
          Start-Sleep 4
          python .github/release_check.py $dir
      - name: Install again over a running copy (what an update does)
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'Installed LimitSwitch'
          Start-Process -FilePath "$dir\LimitSwitch.exe"
          $url = "$dir\.runtime\tray.url"
          foreach ($i in 1..80) { if (Test-Path $url) { break }; Start-Sleep -Milliseconds 250 }
          if (-not (Test-Path $url)) { throw 'the app did not start' }
          $before = (Get-Content $url -Raw).Trim()
          (Start-Process -PassThru -FilePath build\LimitSwitch-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$dir`"").WaitForExit()
          foreach ($i in 1..80) { if ((Test-Path $url) -and (Get-Content $url -Raw).Trim() -ne $before) { break }; Start-Sleep -Milliseconds 250 }
          if (-not (Test-Path $url) -or (Get-Content $url -Raw).Trim() -eq $before) { throw 'the app was not restarted after the update' }
          $running = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'LimitSwitch.exe' })
          Write-Host "PASS updated in place and started again ($($running.Count) process(es))"
          # The app's own setting (on at first run) writes the entry once it has started.
          foreach ($i in 1..60) {
            $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name LimitSwitch -ErrorAction SilentlyContinue).LimitSwitch
            if ($run) { break }; Start-Sleep -Milliseconds 250
          }
          if (-not $run) {
            Get-Content "$env:LOCALAPPDATA\AccountSwitcher\app.log" -ErrorAction SilentlyContinue
            Get-Item 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue | Format-List
            throw 'start at sign-in was not set'
          }
          if ($run -notmatch 'LimitSwitch[.]exe') { throw "start at sign-in runs '$run', not LimitSwitch.exe" }
          Write-Host "PASS start at sign-in: $run"
      - name: The README's measuring snippet works
        run: |
          # The Windows snippet from README.md (Performance), sampling 5 s instead of 60.
          $readme = Get-Content README.md -Raw
          $snippet = [regex]::Match($readme, '(?s)```powershell\r?\n(\$before = .*?)```').Groups[1].Value
          if (-not $snippet) { throw 'no snippet in README.md' }
          $out = Invoke-Expression ($snippet -replace 'Start-Sleep 60', 'Start-Sleep 5' -replace '/ 60 \* 100', '/ 5 * 100')
          Write-Host $out
          if ($out -notmatch 'MB memory') { throw 'the snippet printed nothing useful' }
      - name: Uninstall
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'Installed LimitSwitch'
          # The uninstaller hands over to a copy of itself in %TEMP%: wait for its files to go.
          Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          foreach ($i in 1..120) { if (-not (Test-Path "$dir\unins000.exe")) { break }; Start-Sleep -Milliseconds 500 }
          Start-Sleep 2
          if (Test-Path "$dir\LimitSwitch.exe") { throw 'the exe is still there' }
          $left = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'LimitSwitch.exe' -or ($_.Name -like 'python*' -and $_.CommandLine -match 'LimitSwitch[.]pyw') })
          if ($left.Count) { throw 'the app is still running' }
          if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name LimitSwitch -ErrorAction SilentlyContinue) { throw 'start at sign-in was left behind' }
          $link = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\LimitSwitch.lnk'
          if (Test-Path $link) { throw 'the Start menu shortcut was left behind' }
          Write-Host 'PASS uninstalled cleanly'
      - uses: actions/upload-artifact@v4
        with:
          name: LimitSwitch-Setup
          path: build/LimitSwitch-Setup.exe
          retention-days: 7

  macos:
    runs-on: macos-15  # Apple silicon; the Intel DMG is built here too
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the DMGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/build_mac.py --arch arm64
          python scripts/build_mac.py --arch x86_64
      - name: Install with the README's command (from this build's DMG), run it, install again over it
        run: |
          mkdir -p ~/.codex
          bash scripts/install-mac.sh --dmg build/LimitSwitch-AppleSilicon.dmg
          url="$HOME/Library/Application Support/AccountSwitcher/running.url"
          for i in $(seq 1 80); do [ -f "$url" ] && break; sleep 0.25; done
          [ -f "$url" ] || { cat "$HOME/Library/Application Support/AccountSwitcher/app.log"; exit 1; }
          before=$(cat "$url")
          pgrep -fl MacOS/LimitSwitch
          bash scripts/install-mac.sh --dmg build/LimitSwitch-AppleSilicon.dmg
          for i in $(seq 1 80); do [ -f "$url" ] && [ "$(cat "$url")" != "$before" ] && break; sleep 0.25; done
          [ "$(cat "$url")" != "$before" ] || { echo "the app did not start again after the update"; exit 1; }
          [ "$(pgrep -f MacOS/LimitSwitch | wc -l | tr -d ' ')" = 1 ] || { echo "not exactly one copy running"; exit 1; }
          for i in $(seq 1 40); do grep -q account-switcher ~/.codex/config.toml 2>/dev/null && break; sleep 0.25; done
          grep -q account-switcher ~/.codex/config.toml || { echo "Codex is not routed while running"; exit 1; }
          /Applications/LimitSwitch.app/Contents/Resources/runtime/bin/python3 -B \
            /Applications/LimitSwitch.app/Contents/Resources/app/LimitSwitch.pyw --quit
          sleep 1
          ! pgrep -f MacOS/LimitSwitch || { echo "quit left it running"; exit 1; }
          ! grep -q account-switcher ~/.codex/config.toml || { echo "quit left Codex routed"; exit 1; }
          codesign --verify --deep --strict /Applications/LimitSwitch.app
          echo "PASS installed, updated in place and quit cleanly"
      - uses: actions/upload-artifact@v4
        with:
          name: LimitSwitch-mac
          path: build/*.dmg
          retention-days: 7

  publish:
    if: inputs.publish
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: build
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c "import sys; sys.path.insert(0, '.'); from account_switcher.version import VERSION; print(VERSION)")
          if gh release view "v$v" >/dev/null 2>&1; then echo "v$v is already released: bump VERSION in account_switcher/version.py"; exit 1; fi
          ls -la build
          gh release create "v$v" build/LimitSwitch-Setup.exe build/LimitSwitch-AppleSilicon.dmg build/LimitSwitch-Intel.dmg \
            --title "LimitSwitch $v" --generate-notes --target "${{ github.sha }}"
