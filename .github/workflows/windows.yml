name: Windows app

on:
  workflow_dispatch:  # manual only (Actions tab -> Run workflow), so it uses no minutes by itself

permissions:
  contents: write

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]  # Windows 10 and Windows 11 style taskbars
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install (the installer users run, without starting the app)
        run: |
          New-Item -ItemType Directory -Force "$HOME\.codex" | Out-Null
          python scripts/installer.py --skip-code --no-launch
      - name: Start the app with its full view
        run: Start-Process -FilePath .venv\Scripts\pythonw.exe -ArgumentList "AccountSwitcher.pyw","--show" -WorkingDirectory $PWD
      - name: Smoke test
        run: .venv\Scripts\python.exe .github\win_smoke.py
      - name: Updating replaces a copy it can't reach (its URL file is gone)
        run: |
          Start-Process -FilePath .venv\Scripts\pythonw.exe -ArgumentList "AccountSwitcher.pyw" -WorkingDirectory $PWD
          Start-Sleep 8
          Remove-Item .runtime\tray.url -ErrorAction SilentlyContinue
          python scripts/installer.py --skip-code
          Start-Sleep 3
          $left = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -like 'python*' -and $_.CommandLine -match 'AccountSwitcher[.]pyw' })
          $left | ForEach-Object { $_.CommandLine }
          $log = Get-Content "$env:LOCALAPPDATA\AccountSwitcher\app.log" -Tail 5
          $log
          if ($left.Count -ne 1) { throw "expected one running copy, found $($left.Count)" }
          if (-not ($log -match 'started, version')) { throw "the new copy did not start" }
      - name: Keep screenshots
        if: always()
        shell: bash
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b ci-shots/${{ matrix.os }}
          git -c user.name=ci -c user.email=ci@example.com add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "screenshots ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/ci-shots/${{ matrix.os }}"
