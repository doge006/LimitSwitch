name: Windows app

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install (the installer users run, without starting the app)
        run: |
          New-Item -ItemType Directory -Force "$HOME\.codex" | Out-Null
          python scripts/installer.py --skip-code --no-launch
      - name: Start the app with its full view
        run: Start-Process -FilePath .venv\Scripts\pythonw.exe -ArgumentList "AccountSwitcher.pyw","--show" -WorkingDirectory $PWD
      - name: Smoke test
        run: .venv\Scripts\python.exe .github\win_smoke.py
      - name: Keep screenshots
        if: always()
        shell: bash
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b ci-shots/windows
          git -c user.name=ci -c user.email=ci@example.com add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "screenshots ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/ci-shots/windows"
