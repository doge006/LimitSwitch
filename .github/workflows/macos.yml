name: macOS app

on:
  workflow_dispatch:  # manual only (Actions tab -> Run workflow), so it uses no minutes by itself

permissions:
  contents: write

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-latest]  # latest: the newest macOS GitHub offers (27 once available)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the universal launcher (scripts/mac_launcher, the installer's fallback)
        run: |
          clang -arch arm64 -arch x86_64 -mmacosx-version-min=11.0 -O2 -Wall -o /tmp/mac_launcher scripts/mac_launcher.c
          lipo -info /tmp/mac_launcher
          if ! cmp -s /tmp/mac_launcher scripts/mac_launcher; then cp /tmp/mac_launcher scripts/mac_launcher; fi
      - name: Install (the same script users run)
        run: |
          mkdir -p ~/.codex
          launchctl setenv ACCOUNT_SWITCHER_DEBUG 1
          sw_vers
          bash Install.command --skip-code
      - name: HTTPS from the app's Python (usage APIs)
        run: |
          .venv/bin/python3 -c "
          from account_switcher import providers
          try:
              providers._http('GET', providers.Claude.USAGE_URL, {'Authorization': 'Bearer invalid', 'anthropic-beta': 'oauth-2025-04-20'})
          except providers.ProviderError as error:
              print('usage API answered:', error)
              assert 'unreachable' not in str(error) and 'certificate' not in str(error), error
          "
      - name: Claude Code's status line command works (what the app wrote into settings.json)
        run: |
          sleep 8
          python3 - <<'PY'
          import json, os, subprocess, time
          settings = json.load(open(os.path.expanduser("~/.claude/settings.json")))
          command = settings["statusLine"]["command"]
          print("command:", command)
          sample = json.dumps({"session_id": "ci", "rate_limits": {"five_hour": {"used_percentage": 12, "resets_at": time.time() + 3600}}})
          start = time.time()
          done = subprocess.run(["/bin/bash", "-c", command], input=sample, capture_output=True, text=True, timeout=20)
          print("exit:", done.returncode, "seconds:", round(time.time() - start, 2))
          print("stdout:", done.stdout[:300]); print("stderr:", done.stderr[:600])
          assert done.returncode == 0, "status line command failed"
          assert time.time() - start < 5, "status line command is slow"
          PY
          pgrep -fl "Account Switcher" || true
      - name: Smoke test
        run: |
          python3 -m venv /tmp/probe
          /tmp/probe/bin/pip install --quiet pyobjc-framework-Quartz
          /tmp/probe/bin/python .github/mac_smoke.py
      - name: Again with the prebuilt launcher (as when the Mac's build tools can't link)
        run: |
          bash Install.command --skip-code --prebuilt-launcher
          /tmp/probe/bin/python .github/mac_smoke.py
      - name: Keep the launcher build
        if: matrix.os == 'macos-15'
        run: |
          mkdir -p /tmp/launcher && cp /tmp/mac_launcher /tmp/launcher/mac_launcher && cd /tmp/launcher
          git init -q -b ci-build/mac-launcher
          git -c user.name=ci -c user.email=ci@example.com add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "mac_launcher from ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/ci-build/mac-launcher"
      - name: Keep screenshots
        if: always()
        run: |
          [ -d shots ] || exit 0
          branch="ci-shots/${{ matrix.os }}"
          cd shots
          git init -q -b "$branch"
          git -c user.name=ci -c user.email=ci@example.com add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "screenshots ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$branch"
