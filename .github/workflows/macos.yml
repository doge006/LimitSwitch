name: macOS app

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install (the same script users run)
        run: |
          mkdir -p ~/.codex
          launchctl setenv ACCOUNT_SWITCHER_DEBUG 1
          sw_vers
          bash Install.command --skip-code
      - name: Smoke test
        run: |
          python3 -m venv /tmp/probe
          /tmp/probe/bin/pip install --quiet pyobjc-framework-Quartz
          /tmp/probe/bin/python .github/mac_smoke.py
      - name: Control (a minimal native menu bar app)
        if: always()
        run: |
          app=/tmp/StatusProbe.app; mkdir -p $app/Contents/MacOS
          swiftc -O .github/probe/StatusProbe.swift -o $app/Contents/MacOS/StatusProbe
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.example.statusprobe" -c "Add :CFBundleExecutable string StatusProbe" -c "Add :LSUIElement bool true" $app/Contents/Info.plist
          codesign --force --sign - $app
          open -W -o /tmp/probe.out $app &
          sleep 6
          cat /tmp/probe.out || true
          mkdir -p shots; screencapture -x shots/5-probe.png
          pkill StatusProbe || true
      - name: Which part macOS rejects (PyObjC variants)
        if: always()
        run: |
          for v in title symbol symbol+regular symbol+regular-later symbol+menu; do
            .venv/bin/python3 .github/probe/pyprobe.py "$v" || echo "$v failed"
          done
      - name: Menu bar details
        if: always()
        run: |
          defaults read org.python.python 2>/dev/null | grep -i -A2 statusitem || true
          defaults read com.apple.controlcenter 2>/dev/null | head -40 || true
          ls ~/Library/Group\ Containers/group.com.apple.controlcenter* 2>/dev/null || true
      - name: Keep screenshots
        if: always()
        run: |
          [ -d shots ] || exit 0
          branch="ci-shots/${{ matrix.os }}"
          cd shots
          git init -q -b "$branch"
          git -c user.name=ci -c user.email=ci@example.com add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "screenshots ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$branch"
