<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Account Switcher</title>
<link rel="icon" href="/assets/switcher.png">
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<main>
  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="/assets/switcher.png" alt="">
      <div>
        <h1>Account Switcher</h1>
        <p>Every Claude and Codex limit, at a glance.</p>
      </div>
    </div>
    <div class="topbar-tools">
      <div class="auto-wrap">
        <button type="button" class="button" id="auto-button" aria-haspopup="true" aria-expanded="false" aria-controls="auto-menu">
          Automation <span class="state-pill" id="automation-state">Idle</span>
          <svg viewBox="0 0 24 24" aria-hidden="true" class="caret"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="auto-menu" id="auto-menu" hidden>
          <label class="toggle">
            <input type="checkbox" role="switch" id="auto-swap">
            <span class="track"><span class="thumb"></span></span>
            <span class="toggle-text"><strong>Auto swap</strong><small>Move to the account with the most headroom when a limit hits</small></span>
          </label>
          <label class="toggle">
            <input type="checkbox" role="switch" id="afk">
            <span class="track"><span class="thumb"></span></span>
            <span class="toggle-text"><strong>AFK mode</strong><small>Continue a session by itself after a usage limit</small></span>
          </label>
        </div>
      </div>
      <div class="add-wrap">
        <button type="button" class="button" id="add" hidden aria-haspopup="menu">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="plus"><path d="M12 5v14M5 12h14"/></svg>Add account
        </button>
        <div class="add-menu" id="add-menu" role="menu" hidden>
          <button type="button" role="menuitem" data-add="claude"><img src="/assets/claude.png" alt="">Claude account</button>
          <button type="button" role="menuitem" data-add="codex"><img src="/assets/codex.png" alt="">Codex account</button>
        </div>
      </div>
      <button type="button" class="icon-button" id="reset" aria-label="Reset sample accounts" title="Reset sample accounts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
      </button>
    </div>
  </header>


  <div id="accounts"></div>

  <section class="lab" id="lab">
    <button type="button" class="lab-head" id="lab-toggle" aria-expanded="false" aria-controls="lab-body">
      <span class="chevron" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></span>
      <span class="lab-title">Recovery lab <small>Tool-free Claude session against local test upstreams</small></span>
      <span class="status" id="status" role="status">Ready</span>
    </button>
    <div class="lab-body" id="lab-body">
      <div class="lab-inner">
        <div class="lab-grid">
          <div class="console">
            <div class="console-bar"><span id="backend">Local backend</span><span id="session-id">No active session</span></div>
            <div id="output" class="output" aria-label="Session output" aria-live="polite">Turn on AFK mode, then run a mid-response failure to watch the session swap and continue.</div>
            <div class="actions">
              <select id="scenario" aria-label="Test scenario">
                <option value="partial">Mid-response quota failure</option>
                <option value="quota">Quota before response</option>
                <option value="normal">Normal response</option>
              </select>
              <button type="button" class="button primary" id="run">Run test <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 8 7-8 7Z"/></svg></button>
              <button type="button" class="button" id="continue">Continue</button>
              <button type="button" class="button quiet" id="stop">Stop session</button>
            </div>
          </div>
          <div class="timeline-wrap">
            <h3>Activity</h3>
            <ol class="timeline" id="log"></ol>
          </div>
        </div>
      </div>
    </div>
  </section>

</main>
<div class="sub-editor" id="sub-editor" role="dialog" aria-label="Subscription date" hidden>
  <div class="sub-kind">
    <label><input type="radio" name="sub-kind" id="sub-renews" checked> Renews</label>
    <label><input type="radio" name="sub-kind" id="sub-ends"> Ends (cancelled)</label>
  </div>
  <input type="date" id="sub-date" aria-label="Date">
  <p id="sub-source"></p>
  <div class="sub-actions">
    <button type="button" class="button quiet" id="sub-clear">Use detected</button>
    <button type="button" class="button quiet" id="sub-cancel">Cancel</button>
    <button type="button" class="button primary" id="sub-save">Save</button>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
