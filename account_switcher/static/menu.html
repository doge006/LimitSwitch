<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>LimitSwitch</title>
<link rel="stylesheet" href="/menu.css">
</head>
<body>
<header>
  <img class="mark" src="/assets/switcher.png" alt="">
  <span class="title">LimitSwitch</span>
  <button id="pop" class="icon-btn" type="button" title="Pop out" aria-label="Pop out" hidden>
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8.5 2.5h5v5M13.5 2.5 7.5 8.5M11.5 9.5v3.5a.5.5 0 0 1-.5.5H3a.5.5 0 0 1-.5-.5V5a.5.5 0 0 1 .5-.5h3.5" /></svg>
  </button>
  <button id="full" class="pill" type="button">Full view <span aria-hidden="true">›</span></button>
</header>
<main id="list" aria-live="polite"></main>
<footer>
  <label class="switch"><input id="auto" type="checkbox"><span class="knob"></span>Auto swap</label>
  <label class="switch"><input id="afk" type="checkbox"><span class="knob"></span>Auto resume</label>
  <button id="size" class="icon-btn" type="button" title="Compact: only the accounts in use" aria-label="Compact">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path id="size-icon" d="M2.5 6H6V2.5M13.5 6H10V2.5M2.5 10H6v3.5M13.5 10H10v3.5" /></svg>
  </button>
  <button id="quit" class="icon-btn" type="button" title="Quit LimitSwitch" aria-label="Quit">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.2 3.8a5.5 5.5 0 1 0 5.6 0" /><path d="M8 1.6v6" /></svg>
  </button>
</footer>
<script src="/menu.js"></script>
</body>
</html>
