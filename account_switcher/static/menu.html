<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Account Switcher</title>
<link rel="stylesheet" href="/menu.css">
</head>
<body>
<header>
  <img class="mark" src="/assets/switcher.png" alt="">
  <span class="title">Account Switcher</span>
  <button id="full" class="pill" type="button">Full view <span aria-hidden="true">›</span></button>
</header>
<main id="list" aria-live="polite"></main>
<footer>
  <label class="switch"><input id="auto" type="checkbox"><span class="knob"></span>Auto swap</label>
  <label class="switch"><input id="afk" type="checkbox"><span class="knob"></span>AFK</label>
  <button id="quit" class="icon-btn" type="button" title="Quit Account Switcher" aria-label="Quit">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.2 3.8a5.5 5.5 0 1 0 5.6 0" /><path d="M8 1.6v6" /></svg>
  </button>
</footer>
<script src="/menu.js"></script>
</body>
</html>
